# Stage 2 of SeenIt's event-driven deploy chain: seenit-frontend's deploy.yml
# dispatches run-smoke here after pushing a build to the public `seenit` repo;
# this suite hits the live URL and dispatches the verdict back
# (smoke-passed / smoke-failed), which seenit-frontend's verdict.yml turns
# into mark-deployed or rollback.
#
# This repo is PUBLIC on purpose — Actions minutes are unlimited for public
# repos, and the Playwright run (browser install included) is the most
# expensive job in the whole chain. The prices of being public are paid
# below, deliberately:
#   - triggers are ONLY repository_dispatch/workflow_dispatch. Never
#     pull_request: a fork PR must not be able to start a run that holds
#     TEST_USER.
#   - every byte of output passes through scripts/redact-secrets.js BEFORE
#     touching disk: the log is a public artifact, and the login/password
#     are jq-derived from the TEST_USER JSON, so Actions' automatic masking
#     has never seen them (it masks only exact secret strings it was given).
#   - Playwright traces are never uploaded: a trace records each action's
#     arguments — including the literal password typed into fill().
name: Smoke

on:
  repository_dispatch:
    types: [run-smoke]
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL to smoke-test (blank = production)"
        required: false
        default: ""
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the generated report to the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for the deploy to actually be served
        run: |
          URL="${{ github.event.client_payload.base_url || inputs.base_url || 'https://alvl-station.github.io/seenit/' }}"
          echo "Waiting for $URL"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            if [ "$code" = "200" ]; then echo "Serving (attempt $i)."; exit 0; fi
            sleep 2
          done
          echo "::warning::Never returned 200 after 60s, running the suite anyway."

      - name: Run smoke suite (redacted output)
        id: run
        run: |
          set -o pipefail
          echo "$TEST_USER" | jq -e 'has("login") and has("password")' > /dev/null || {
            echo "::error::TEST_USER secret does not look like valid JSON with 'login' and 'password' fields."
            exit 1
          }
          export SMOKE_TEST_USERNAME="$(echo "$TEST_USER" | jq -r '.login')"
          export SMOKE_TEST_PASSWORD="$(echo "$TEST_USER" | jq -r '.password')"
          echo "::add-mask::$SMOKE_TEST_USERNAME"
          echo "::add-mask::$SMOKE_TEST_PASSWORD"
          npx bddgen
          npx playwright test --config playwright.config.js 2>&1 \
            | node scripts/redact-secrets.js SMOKE_TEST_USERNAME SMOKE_TEST_PASSWORD \
            | tee smoke-test-log.txt
        env:
          BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url || 'https://alvl-station.github.io/seenit/' }}
          TEST_USER: ${{ secrets.TEST_USER }}

      # ---- Allure report -> its own public Pages site (gh-pages branch) ----
      # Videos exist only for failures; trimmed to the last 3s (the moment
      # it broke) per the roadmap. Traces are off entirely — they record
      # fill() arguments and this report is public (REQUIREMENTS S-4/S-5).
      # Screenshots/videos are safe because the login fields are visually
      # masked (support/fixtures.js).
      # NOT preinstalled on ubuntu-latest (assumed it was; the first drill
      # run reported ENOENT and kept every video untrimmed).
      - name: Install ffmpeg
        if: always()
        run: sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Trim failure videos to 3s
        if: always()
        run: node scripts/trim-videos.js allure-results 3

      # Allure builds its trend chart from a history/ folder carried over
      # from the PREVIOUS report. Without it every run renders a chart with
      # one point on it.
      #
      # This step existed and never worked: it checked out gh-pages into
      # /tmp/ghp without creating the directory first, so git refused with
      # "this operation must be run in a work tree" — and the failure was
      # swallowed three times over, by 2>/dev/null, by `|| exit 0`, and by
      # continue-on-error. The chart showed one point for months and nothing
      # anywhere said why. No work tree is needed at all: git archive can
      # pull a single folder straight out of the fetched commit.
      - name: Restore Allure history (keeps the trend chart across runs)
        if: always()
        run: |
          set -uo pipefail
          rm -rf /tmp/ghp && mkdir -p /tmp/ghp
          if ! git fetch --depth=1 origin gh-pages; then
            echo "::notice::No gh-pages branch yet — this run starts the history."
            exit 0
          fi
          git archive FETCH_HEAD history 2>/dev/null | tar -x -C /tmp/ghp || true
          if [ -d /tmp/ghp/history ] && [ -n "$(ls -A /tmp/ghp/history)" ]; then
            mkdir -p allure-results/history
            cp -r /tmp/ghp/history/. allure-results/history/
            points=$(python3 -c "import json;print(len(json.load(open('/tmp/ghp/history/history-trend.json'))))" 2>/dev/null || echo '?')
            echo "Restored history from the published report ($points trend point(s) so far)."
          else
            echo "::warning::gh-pages carries no history/ folder, so the trend chart restarts at one point. If this warning appears on every run, history is not being carried forward."
          fi

      # Without this a trend point carries no build number and no link, so a
      # regression can be seen on the chart but not traced back to the run
      # that caused it — most of the value of keeping history at all.
      #
      # reportName/reportUrl, not buildName/buildUrl: those are the two
      # fields Allure copies onto a trend point. The first attempt set only
      # buildName and the newest point came out unlabelled, pointing at the
      # report itself. The URL is the RUN, because that is where someone
      # goes after clicking a point that dropped.
      - name: Label this run for the trend chart
        if: always()
        run: |
          mkdir -p allure-results
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "buildOrder": ${{ github.run_number }},
            "buildName": "smoke #${{ github.run_number }}",
            "buildUrl": "$RUN_URL",
            "reportName": "smoke #${{ github.run_number }}",
            "reportUrl": "$RUN_URL"
          }
          JSON

      - name: Generate the Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish the report to gh-pages
        if: always()
        run: |
          set -euo pipefail
          cd allure-report
          git init -q -b gh-pages
          git config user.name "seenit-e2e"
          git config user.email "e2e@seenit.local"
          git add -A
          git commit -q -m "Allure report — run ${{ github.run_id }} (${{ github.event.client_payload.ref || 'manual' }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Report: https://alvl-station.github.io/seenit-e2e/" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted log artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          # NEVER test-results/ — it holds raw, untrimmed videos and (when
          # enabled) traces. The published Allure report is the artifact
          # that matters; this is just the redacted text log.
          path: |
            smoke-test-log.txt
          retention-days: 14
          if-no-files-found: ignore

      # The verdict is an event, not a return value: seenit-frontend never
      # waits for this run. Skipped for manual (workflow_dispatch) runs —
      # only a real deploy dispatch should be able to move deployed-latest
      # or trigger a rollback.
      - name: Report verdict back to seenit-frontend
        if: always() && github.event_name == 'repository_dispatch'
        run: |
          if [ "${{ steps.run.outcome }}" = "success" ]; then EVENT=smoke-passed; else EVENT=smoke-failed; fi
          gh api -X POST /repos/alvl-station/seenit-frontend/dispatches \
            -f event_type="$EVENT" \
            -f 'client_payload[ref]=${{ github.event.client_payload.ref }}' \
            -f 'client_payload[deploy_run]=${{ github.event.client_payload.deploy_run }}' \
            -f 'client_payload[e2e_run_url]=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            -f 'client_payload[report_url]=https://alvl-station.github.io/seenit-e2e/'
        env:
          GH_TOKEN: ${{ secrets.UI_CALLBACK_PAT }}
